[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ha-ontario-energy-board"
version = "0.3.0"
description = "Ontario Energy Board electricity rates as a Home Assistant integration."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Patrick Wasp" }]
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4",
    "pytest-homeassistant-custom-component>=0.13",
    "syrupy>=4",
    "freezegun>=1.5",
    "ruff>=0.5",
    "mypy>=1.10",
    "defusedxml==0.7.1",
]

[tool.setuptools.packages.find]
include = ["custom_components*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["custom_components/ontario_energy"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "pragma: no cover",
]
show_missing = true

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = [
    "E", "F", "W",       # pycodestyle / pyflakes
    "I",                  # isort
    "B",                  # bugbear
    "UP",                 # pyupgrade
    "SIM",                # simplify
    "RUF",                # ruff-specific
    "C4",                 # comprehensions
    "PIE",                # pie
    "PT",                 # pytest style
    "TID",                # tidy imports
]
ignore = [
    "E501",   # line length handled by formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*" = ["PT", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
disallow_untyped_decorators = true
exclude = ["tests/"]

[[tool.mypy.overrides]]
module = ["defusedxml.*", "pytest_homeassistant_custom_component.*"]
ignore_missing_imports = true

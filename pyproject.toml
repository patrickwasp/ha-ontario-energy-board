[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ha-ontario-energy-board"
version = "0.0.3"
description = "Ontario Energy Board electricity rates as a Home Assistant integration."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Patrick Wasp" }]
requires-python = ">=3.13"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4",
    "pytest-homeassistant-custom-component>=0.13",
    "syrupy>=4",
    "freezegun>=1.5",
    "ruff>=0.5",
    "mypy>=1.10",
    "defusedxml==0.7.1",
]

# Intentionally do not install any source code. HACS file-copies the
# `custom_components/ontario_energy/` directory into the user's HA config —
# the integration is never a pip-installable Python package. pyproject.toml
# exists only to bundle dev dependencies and tooling config.
#
# Installing as an editable package would register a "lenient" namespace
# finder for `custom_components/`, whose pseudo-path then breaks HA's
# `loader._get_custom_components` at test time (it calls `Path.iterdir()`
# on the path string and gets a FileNotFoundError).
[tool.setuptools]
packages = []
py-modules = []

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["custom_components/ontario_energy"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "pragma: no cover",
]
show_missing = true

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = [
    "E", "F", "W",       # pycodestyle / pyflakes
    "I",                  # isort
    "B",                  # bugbear
    "UP",                 # pyupgrade
    "SIM",                # simplify
    "RUF",                # ruff-specific
    "C4",                 # comprehensions
    "PIE",                # pie
    "PT",                 # pytest style
    "TID",                # tidy imports
]
ignore = [
    "E501",   # line length handled by formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*" = ["PT", "B"]
# Relative imports within an integration's own package are the HA convention.
"custom_components/**/*" = ["TID252"]

[tool.mypy]
# Intentionally not pinning ``python_version`` so each CI matrix entry
# (3.12, 3.13) checks against its own runtime. Pinning to "3.12" makes mypy
# reject PEP 696 (`T = int`) syntax it encounters in HA's own source when
# run under 3.13.
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
disallow_untyped_decorators = true
exclude = ["tests/"]

[[tool.mypy.overrides]]
module = ["defusedxml.*", "pytest_homeassistant_custom_component.*"]
ignore_missing_imports = true
